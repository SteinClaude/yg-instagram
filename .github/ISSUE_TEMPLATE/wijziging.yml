name: Planning wijzigen
description: Een item overslaan, verzetten, of van tekst of foto veranderen
title: "Wijziging"
labels: ["wijziging"]
body:
  - type: markdown
    attributes:
      value: |
        Zodra je op **Submit** drukt wordt de planning vanzelf aangepast en krijg je
        hieronder een antwoord. Duurt ongeveer een minuut.

  - type: input
    id: item
    attributes:
      label: Welk item
      description: "Het nummer van het item, bijvoorbeeld 2026-09-21-bericht. Kom je vanuit de app, dan staat dit al ingevuld."
      placeholder: "2026-09-21-bericht"
    validations:
      required: true

  - type: dropdown
    id: actie
    attributes:
      label: Wat moet er gebeuren
      options:
        - Overslaan
        - Verzetten
        - Tekst wijzigen
        - Foto wijzigen
    validations:
      required: true

  - type: input
    id: datum
    attributes:
      label: Nieuwe datum
      description: "Alleen bij Verzetten. Schrijf het als 2026-10-05."
      placeholder: "2026-10-05"

  - type: textarea
    id: tekst
    attributes:
      label: Nieuwe tekst
      description: "Alleen bij Tekst wijzigen. Dit wordt het hele bijschrift, inclusief de hashtags."

  - type: textarea
    id: foto
    attributes:
      label: Nieuwe foto
      description: "Alleen bij Foto wijzigen. Tik in dit vak en voeg de foto toe (op de telefoon via het paperclipje of Kies bestand; op de pc slepen of plakken). Wacht tot er een regel met een link in het vak staat. De foto wordt vanzelf staand bijgesneden."
