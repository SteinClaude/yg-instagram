name: Planning wijzigen
description: Een item overslaan, verzetten of van tekst veranderen
title: "Wijziging"
labels: ["wijziging"]
body:
  - type: markdown
    attributes:
      value: |
        Vul in wat er moet veranderen. Zodra je op **Submit** drukt wordt de planning
        vanzelf aangepast en krijg je hieronder een antwoord. Duurt ongeveer een minuut.

  - type: input
    id: item
    attributes:
      label: Welk item
      description: "Het nummer van het item, bijvoorbeeld 2026-09-21-bericht of 2026-09-21-verhaal. Op de planningspagina staat dit bij elk item."
      placeholder: "2026-09-21-bericht"
    validations:
      required: true

  - type: dropdown
    id: actie
    attributes:
      label: Wat moet er gebeuren
      options:
        - Overslaan
        - Verzetten
        - Tekst wijzigen
    validations:
      required: true

  - type: input
    id: datum
    attributes:
      label: Nieuwe datum
      description: "Alleen invullen bij Verzetten. Schrijf het als 2026-10-05."
      placeholder: "2026-10-05"

  - type: textarea
    id: tekst
    attributes:
      label: Nieuwe tekst
      description: "Alleen invullen bij Tekst wijzigen. Dit wordt het hele bijschrift, inclusief de hashtags."
