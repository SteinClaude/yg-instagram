name: Plaatsen op Instagram

on:
  schedule:
    # Elke tien minuten, op rustige minuten (niet op het hele uur: dan is GitHub het drukst).
    # De tijden in planning.json staan in Amsterdamse tijd; het script rekent dat zelf om. Zomertijd
    # maakt dus niet uit, en een account of een plaatstijd erbij vraagt hier geen nieuwe regel.
    # Een start zonder werk doet niets en maakt geen commit.
    #
    # Waarom zo vaak: GitHub start geplande runs laat of slaat ze over (10-19 nov 2026: de Reels van
    # kanaal 1 kwamen 5 minuten tot 5,5 uur te laat, ook met de extra starts rond 18:00 en 20:00 van
    # 15 nov). Vaker starten mag (GitHub: kortste tussentijd 5 minuten) en kost in een openbare repo
    # niets, maar het is geen garantie. Zie docs/automaat-alle-kanalen.md, "Op tijd plaatsen".
    # Dit vervangt de losse regels per plaatstijd (18:00 en 20:00) en de tak manon/cron-1200-1600.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:          # knop om het met de hand te draaien
    inputs:
      proefvideo:
        description: 'Proef: adres van een video die Instagram moet ophalen (er wordt niets geplaatst)'
        required: false
        default: ''
      proefomslag:
        description: 'Proef: adres van een eigen omslag (jpg) bij die video; leeg = geen'
        required: false
        default: ''
      proefms:
        description: 'Proef: omslagmoment in milliseconden; leeg = 4000'
        required: false
        default: ''
      proefaccount:
        description: 'Proef: op welk account (ygdigital, kanaal-1, kanaal-2 of account-3; de namen uit src/accounts.cjs)'
        required: false
        default: 'ygdigital'

permissions:
  contents: write             # om gedaan.json terug te schrijven
  issues: write               # om te waarschuwen als de sleutel verloopt

concurrency:
  group: plaatsen             # nooit twee runs tegelijk
  cancel-in-progress: false

jobs:
  plaatsen:
    runs-on: ubuntu-latest
    # Er draait nooit meer dan één run tegelijk (concurrency hierboven). Een run die blijft hangen, houdt
    # dus elke volgende start tegen, voor alle accounts. Zonder grens kan dat zes uur duren (de standaard
    # van GitHub). Een gewone run is in een paar minuten klaar.
    timeout-minutes: 45
    steps:
      # Alleen wat de automaat nodig heeft: de bestanden in de hoofdmap (planning.json, gedaan.json,
      # sleutel.json, status.json) en src/. De video's en pakketten (ruim 2 GB) haalt hij niet op;
      # Instagram haalt een video zelf op van het openbare adres.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # De grens op deze stap is korter dan die van de job: loopt hij vast, dan stopt alleen deze stap en
      # bewaart de stap "Bijhouden wat geplaatst is" daarna gewoon wat er al geplaatst is. Het script legt
      # elke post meteen vast, dus wat nog niet aan de beurt kwam, gaat met de volgende start mee.
      - name: Plaatsen wat aan de beurt is
        if: github.event.inputs.proefvideo == ''
        timeout-minutes: 30
        env:
          # Per account twee geheimen: de sleutel en het accountnummer. Leeg = dat account doet niet mee
          # en zijn items wachten. Welke namen bij welk account horen, staat in src/accounts.cjs.
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN_K1: ${{ secrets.IG_TOKEN_K1 }}
          IG_USER_ID_K1: ${{ secrets.IG_USER_ID_K1 }}
          IG_TOKEN_K2: ${{ secrets.IG_TOKEN_K2 }}
          IG_USER_ID_K2: ${{ secrets.IG_USER_ID_K2 }}
          IG_TOKEN_K3: ${{ secrets.IG_TOKEN_K3 }}
          IG_USER_ID_K3: ${{ secrets.IG_USER_ID_K3 }}
          # Alle geheimen van de repo in één keer. Zo werkt een account dat later in src/accounts.cjs
          # bij komt zonder dat dit bestand verandert; het script kiest op naam en toont er nooit een.
          IG_GEHEIMEN: ${{ toJSON(secrets) }}
          REPO_RAW: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: node src/plaatsen.cjs

      # Met de hand: Actions > Run workflow > adres van een video invullen. Zet een
      # reel klaar bij Instagram zonder te publiceren, om te zien of hij geaccepteerd wordt.
      - name: Proef met een video (er wordt niets geplaatst)
        if: github.event.inputs.proefvideo != ''
        timeout-minutes: 15
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN_K1: ${{ secrets.IG_TOKEN_K1 }}
          IG_USER_ID_K1: ${{ secrets.IG_USER_ID_K1 }}
          IG_TOKEN_K2: ${{ secrets.IG_TOKEN_K2 }}
          IG_USER_ID_K2: ${{ secrets.IG_USER_ID_K2 }}
          IG_TOKEN_K3: ${{ secrets.IG_TOKEN_K3 }}
          IG_USER_ID_K3: ${{ secrets.IG_USER_ID_K3 }}
          IG_GEHEIMEN: ${{ toJSON(secrets) }}
          REPO_RAW: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
          PROEF_VIDEO: ${{ github.event.inputs.proefvideo }}
          PROEF_OMSLAG: ${{ github.event.inputs.proefomslag }}
          PROEF_MS: ${{ github.event.inputs.proefms }}
          PROEF_ACCOUNT: ${{ github.event.inputs.proefaccount }}
        run: node src/plaatsen.cjs --proefvideo "$PROEF_VIDEO" ${PROEF_OMSLAG:+--proefomslag "$PROEF_OMSLAG"} ${PROEF_MS:+--proefms "$PROEF_MS"} ${PROEF_ACCOUNT:+--account "$PROEF_ACCOUNT"}

      # Deze stap mag NOOIT klappen. Gebeurt dat toch, dan wordt gedaan.json niet
      # bewaard, denkt de volgende run dat er nog niets geplaatst is en gaat
      # hetzelfde bericht er nog een keer uit - elke run opnieuw. Dat is op
      # 15 september 2026 gebeurd: "git add sleutel.json" viel over een bestand
      # dat er niet altijd is, en twee items zijn zesmaal geplaatst.
      - name: Bijhouden wat geplaatst is
        if: always()
        run: |
          bestanden=""
          for f in gedaan.json sleutel.json status.json; do
            [ -f "$f" ] && bestanden="$bestanden $f"
          done
          if [ -z "$bestanden" ] || [ -z "$(git status --porcelain $bestanden)" ]; then
            echo "niets nieuws om te bewaren"
            exit 0
          fi
          git config user.name  "YG plaatser"
          git config user.email "actions@users.noreply.github.com"
          git add $bestanden
          git commit -m "geplaatst op $(TZ=Europe/Amsterdam date '+%d-%m-%Y %H:%M')"
          # opnieuw proberen als er ondertussen iets anders is gepusht (een maker die inplant)
          for poging in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push mislukt, poging $poging; eerst ophalen"
            git pull --rebase --autostash || true
            sleep 3
          done
          echo "kon het logboek niet wegschrijven; volgende run probeert het opnieuw"

      # Per account een eigen melding (src/plaatsen.cjs zet per account een bestand klaar in
      # waarschuwingen/; regel 1 is de titel). Zo blijft een waarschuwing voor het ene account
      # niet hangen achter een melding van een ander account die nog open staat.
      # Mislukt hier iets, dan heeft dat geen gevolgen: het logboek is hierboven al bewaard.
      - name: Waarschuwen als een sleutel niet meer werkt of bijna verloopt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for f in waarschuwingen/*.txt; do
            titel="$(head -n 1 "$f")"
            [ -n "$titel" ] || continue
            tail -n +3 "$f" > "$RUNNER_TEMP/melding.txt"
            if ! open="$(gh issue list --state open --limit 200 --json title --jq '.[].title')"; then
              echo "kon de open meldingen niet opvragen; de volgende run probeert het opnieuw"
              exit 0
            fi
            if printf '%s\n' "$open" | grep -Fxq -- "$titel"; then
              echo "melding \"$titel\" staat al open"
            else
              gh issue create --title "$titel" --body-file "$RUNNER_TEMP/melding.txt" || echo "kon de melding \"$titel\" niet maken; de volgende run probeert het opnieuw"
            fi
          done
