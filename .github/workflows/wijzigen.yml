name: Planning wijzigen

# Draait zodra jij een melding vanuit het wijzig- of nieuw-formulier opent of bijwerkt.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: wijzigen                       # nooit twee wijzigingen tegelijk in hetzelfde bestand
  cancel-in-progress: false

jobs:
  wijzigen:
    # Herkent het formulier aan de inhoud, niet aan een label: GitHub kent het label
    # van een formuliersjabloon niet altijd toe.
    # En alleen als de eigenaar van de repo het instuurt: de repo is openbaar, dus
    # iedereen met een GitHub-account kan het formulier openen. Dat mag niet
    # doorwerken in de planning.
    # En alleen zolang de melding open staat: een bewerking van een al afgehandelde
    # melding zou anders nog eens uitgevoerd worden (en een nieuw item dubbel zetten).
    if: >-
      (contains(github.event.issue.body, 'Welk item') || contains(github.event.issue.body, 'Wat wordt het'))
      && github.event.issue.user.login == github.repository_owner
      && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Alleen nodig als er een foto bij zit; de repo zelf blijft zonder pakketten.
      - name: Fotogereedschap ophalen
        if: contains(github.event.issue.body, 'https://')
        run: npm install --no-save --no-audit --no-fund --loglevel=error sharp@0.33.5

      - name: Wijziging uitvoeren
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node gereedschap/wijzig.cjs

      - name: Planning bewaren
        run: |
          if [ -n "$(git status --porcelain planning.json beeld mini)" ]; then
            git config user.name  "YG plaatser"
            git config user.email "actions@users.noreply.github.com"
            git add planning.json beeld mini
            git commit -m "wijziging uit melding #${{ github.event.issue.number }}"
            gepusht=nee
            for poging in 1 2 3; do
              if git push; then gepusht=ja; break; fi
              git pull --rebase --autostash || true
              sleep 3
            done
            echo "gelukt=$gepusht" >> $GITHUB_ENV
            if [ "$gepusht" = "nee" ]; then
              printf 'Het bewaren op GitHub is niet gelukt. Probeer het over een paar minuten opnieuw door de melding bij te werken.' > antwoord.txt
            fi
          else
            echo "gelukt=nee" >> $GITHUB_ENV
          fi

      # Altijd antwoorden, ook als een eerdere stap omviel: anders blijft de melding
      # stil openstaan en lijkt het of er niets is aangekomen.
      - name: Antwoorden onder de melding
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f antwoord.txt ] || printf 'Er ging iets mis in de automaat. Probeer het over een paar minuten opnieuw door de melding bij te werken.' > antwoord.txt
          gh issue comment ${{ github.event.issue.number }} --body-file antwoord.txt
          if [ "$gelukt" = "ja" ]; then
            gh issue close ${{ github.event.issue.number }} --reason completed
          fi

  # Formulier van iemand anders: niet uitvoeren, wel netjes dichtdoen zodat het opvalt.
  afwijzen:
    if: >-
      (contains(github.event.issue.body, 'Welk item') || contains(github.event.issue.body, 'Wat wordt het'))
      && github.event.issue.user.login != github.repository_owner
      && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Melding sluiten
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMMER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMMER" --body 'Alleen de eigenaar van deze planning kan wijzigingen doorvoeren. Deze melding is niet uitgevoerd.'
          gh issue close "$NUMMER" --reason 'not planned'
