<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F1E8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141414">
<link rel="manifest" href="app/manifest.webmanifest">
<link rel="icon" href="app/icoon-192.png" type="image/png">
<link rel="apple-touch-icon" href="app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="YG Instagram">
<title>Instagram-planning · YG Digital</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Montserrat:wght@400;500;600&display=swap">
<style>
  :root{
    --grond:#F6F1E8; --kaart:#FFFDF9; --verhoog:#EFE8DA;
    --ink:#1C1B18; --ink-zacht:#6B665E; --ink-flauw:#8C877D;
    --goud:#8C6F3A; --goud-tekst:#7B6132; --goud-hi:#C9A45C;
    --lijn:rgba(140,111,58,.26); --lijn-zacht:rgba(140,111,58,.14);
    --gedaan:#3F7150; --let-op:#A6462F;
    --serif:"Playfair Display",Georgia,"Times New Roman",serif;
    --sans:"Montserrat",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --tabhoogte:58px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --grond:#141414; --kaart:#1B1B1B; --verhoog:#0E0E0E;
      --ink:#F3EEE4; --ink-zacht:#C9C3B8; --ink-flauw:#8F8A80;
      --goud:#C9A45C; --goud-tekst:#C9A45C; --goud-hi:#E3C889;
      --lijn:rgba(201,164,92,.30); --lijn-zacht:rgba(201,164,92,.16);
      --gedaan:#7FB08E; --let-op:#E0866F;
    }
  }
  *{box-sizing:border-box}
  html{color-scheme:light dark}
  body{margin:0; background:var(--grond); color:var(--ink); font-family:var(--sans); font-size:15px;
       line-height:1.55; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent}
  img{max-width:100%}
  a{color:var(--goud-tekst)}
  button{font:inherit; color:inherit}

  .app{max-width:720px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column}
  .top{display:flex; justify-content:space-between; align-items:center; gap:12px;
       padding:calc(14px + env(safe-area-inset-top)) 20px 12px; border-bottom:1px solid var(--lijn-zacht)}
  .merknaam{font-family:var(--serif); font-size:1.05rem}
  .stand{font-size:.68rem; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-zacht);
         display:flex; align-items:center; gap:8px; white-space:nowrap}
  .stip{width:8px; height:8px; border-radius:50%; background:var(--gedaan); flex:none}
  .stand.stil{color:var(--let-op)} .stand.stil .stip{background:var(--let-op)}
  .stand.laden .stip{background:var(--ink-flauw)}

  main{flex:1; padding:22px 20px calc(var(--tabhoogte) + 28px + env(safe-area-inset-bottom))}
  .tab{display:none} .tab.actief{display:block}
  h1{font-family:var(--serif); font-weight:400; font-size:1.7rem; line-height:1.2; margin:0}
  .sub{color:var(--ink-flauw); font-size:.8rem; margin:4px 0 0}
  .koprij{display:flex; justify-content:space-between; align-items:flex-start; gap:14px}
  .kopje{font-size:.66rem; font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:var(--goud-tekst); margin:28px 0 6px}
  .kopje.koprij{align-items:baseline; margin-bottom:10px}
  .leeg{color:var(--ink-flauw); font-size:.9rem; padding:12px 0}

  /* Eén regel per item. De hele regel is de knop; er is niets anders om op te tikken. */
  .rij{display:grid; grid-template-columns:46px 1fr auto; gap:14px; align-items:center; width:100%;
       padding:12px 0; border:0; border-top:1px solid var(--lijn-zacht); background:none; text-align:left; cursor:pointer}
  .rij img{width:46px; height:58px; object-fit:cover; border-radius:2px; border:1px solid var(--lijn-zacht); display:block; background:var(--verhoog)}
  .wanneer{font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--goud-tekst)}
  .titel{font-weight:500; margin-top:2px; line-height:1.4; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
  .rij.voorbij .titel{color:var(--ink-flauw); font-weight:400}
  .recht{font-size:.68rem; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-flauw); white-space:nowrap}
  .recht.ok{color:var(--gedaan)} .recht.mis{color:var(--let-op)}
  .pijl{color:var(--ink-flauw); font-size:1.2rem; line-height:1}

  details.week{border-top:1px solid var(--lijn-zacht); border-bottom:1px solid var(--lijn-zacht)}
  details.week>summary{cursor:pointer; padding:14px 0; font-family:var(--serif); font-size:1.05rem;
      display:flex; justify-content:space-between; align-items:baseline; gap:12px; list-style:none}
  details.week>summary::-webkit-details-marker{display:none}
  details.week>summary .tel::after{content:"+"; color:var(--goud-tekst); margin-left:14px}
  details.week[open]>summary .tel::after{content:"\2212"}
  details.week .rij{padding-left:0}
  .tel{font-family:var(--sans); font-size:.72rem; color:var(--ink-flauw); letter-spacing:.06em; white-space:nowrap}

  /* Weken naast elkaar: schuiven in plaats van scrollen, dan blijft de pagina kort. */
  .strook{display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; margin:0 -20px; padding:2px 20px 8px}
  /* Op een aanraakscherm is de schuifbalk overbodig; met een muis is hij de enige aanwijzing. */
  @media (hover:none){ .strook{scrollbar-width:none} .strook::-webkit-scrollbar{display:none} }
  .kolom{flex:0 0 78%; max-width:320px; scroll-snap-align:start; border:1px solid var(--lijn-zacht); border-radius:4px;
         background:var(--kaart); padding:4px 14px 6px}
  .kolom h3{font-family:var(--serif); font-weight:400; font-size:1rem; margin:0; padding:10px 0 8px;
            display:flex; justify-content:space-between; align-items:baseline; gap:10px}
  .kolom .rij{grid-template-columns:36px 1fr; gap:10px; padding:9px 0}
  .kolom .rij img{width:36px; height:45px}
  .kolom .rij .titel{-webkit-line-clamp:1; font-size:.9rem}
  .kolom .rij .recht{grid-column:2; justify-self:start; margin-top:-2px}
  .kolom .rij .pijl{display:none}
  .kolom .leeg{padding:8px 0 12px}
  @media (min-width:720px){ .kolom{flex-basis:300px} }
  /* Deze week: dezelfde kaart, maar over de volle breedte en in te klappen. */
  .kolom.vol{flex:none; max-width:none; width:100%; margin-top:22px}
  details.kolom>summary{cursor:pointer; list-style:none; font-family:var(--serif); font-size:1rem; padding:10px 0 8px;
      display:flex; justify-content:space-between; align-items:baseline; gap:10px}
  details.kolom>summary::-webkit-details-marker{display:none}
  details.kolom>summary .tel::after{content:"+"; color:var(--goud-tekst); margin-left:14px}
  details.kolom[open]>summary .tel::after{content:"\2212"}

  .knop{display:inline-flex; align-items:center; justify-content:center; min-height:46px; font-family:var(--sans);
        font-size:.7rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--goud-tekst);
        background:transparent; border:1px solid var(--goud); border-radius:2px; padding:10px 16px; cursor:pointer;
        text-decoration:none; white-space:nowrap}
  .knop:hover{background:var(--goud); color:var(--grond)}
  .knop.klein{min-height:38px; padding:6px 14px}

  /* Tabbladen: onderaan op de telefoon, bovenaan op een groot scherm. */
  .tabs{position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex;
        height:calc(var(--tabhoogte) + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom);
        background:var(--kaart); border-top:1px solid var(--lijn)}
  .tabs button{flex:1; background:none; border:0; font-size:.64rem; font-weight:600; letter-spacing:.14em;
        text-transform:uppercase; color:var(--ink-flauw); cursor:pointer; display:flex; flex-direction:column;
        align-items:center; justify-content:center; gap:7px; padding:0}
  .tabs button::before{content:""; width:5px; height:5px; border-radius:50%; background:transparent}
  .tabs button.actief{color:var(--ink)} .tabs button.actief::before{background:var(--goud)}
  @media (min-width:720px){
    .tabs{position:sticky; top:0; bottom:auto; height:52px; padding:0; border-top:0; border-bottom:1px solid var(--lijn)}
    .tabs button{flex-direction:row}
    main{padding-bottom:60px}
  }

  /* Het detailscherm: op de telefoon beeldvullend, op een groot scherm een venster. */
  .vel{position:fixed; inset:0; z-index:30; display:none; overflow:auto; background:var(--grond); -webkit-overflow-scrolling:touch}
  .vel.open{display:block}
  .vel-kader{min-height:100%}
  .vel-kop{position:sticky; top:0; z-index:1; display:flex; justify-content:space-between; align-items:center; gap:12px;
           padding:calc(12px + env(safe-area-inset-top)) 20px 12px; background:var(--grond); border-bottom:1px solid var(--lijn-zacht)}
  .vel-kop .wanneer{font-size:.72rem}
  .sluit{background:none; border:0; padding:8px 0 8px 12px; font-size:.7rem; font-weight:600; letter-spacing:.14em;
         text-transform:uppercase; color:var(--ink-zacht); cursor:pointer}
  .vel-beeld{display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x mandatory; padding:20px 20px 0}
  .vel-beeld img{max-height:54vh; max-width:100%; border-radius:2px; border:1px solid var(--lijn-zacht); scroll-snap-align:center; flex:none; background:var(--verhoog)}
  .vel-body{padding:16px 20px calc(30px + env(safe-area-inset-bottom))}
  .toestand{font-size:.72rem; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-flauw)}
  .toestand:empty{display:none}
  .toestand.ok{color:var(--gedaan)} .toestand.mis{color:var(--let-op)}
  .bijschrift{white-space:pre-wrap; font-size:.9rem; line-height:1.6; color:var(--ink); margin:0}
  .toestand:not(:empty) + #velinhoud .bijschrift{margin-top:12px}
  .acties{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:24px}
  .acties .knop{width:100%; white-space:normal; letter-spacing:.08em; padding-left:8px; padding-right:8px}
  @media (max-width:359px){ .acties{grid-template-columns:1fr} }
  .noot{font-size:.78rem; color:var(--ink-flauw); margin:12px 0 0; line-height:1.5}
  @media (min-width:720px){
    .vel{background:rgba(0,0,0,.5); padding:40px 20px}
    .vel-kader{max-width:560px; min-height:0; margin:0 auto; background:var(--grond); border-radius:6px; overflow:hidden}
    .vel-kop{position:static; padding-top:14px}
  }

  /* Melding over de toestand van de automaat; alleen te zien als er iets mis is. */
  .melding{margin:0 0 20px; padding:16px 18px; border:1px solid var(--lijn); border-left:4px solid var(--let-op);
           background:var(--kaart); border-radius:3px}
  .melding b{display:block; color:var(--let-op); font-size:.95rem; margin-bottom:6px}
  .melding p{margin:0 0 6px; font-size:.88rem; line-height:1.55; color:var(--ink-zacht)}
  .melding small{display:block; margin-top:6px; font-size:.74rem; color:var(--ink-flauw)}

  .installeer{margin:0 0 22px; padding:12px 16px; border:1px dashed var(--lijn); border-radius:3px; font-size:.84rem;
              color:var(--ink-zacht); display:flex; gap:12px; align-items:center; justify-content:space-between}
  .installeer b{color:var(--ink); font-weight:600}

  .hulp h2{font-family:var(--serif); font-weight:400; font-size:1.15rem; margin:26px 0 6px}
  .hulp p{color:var(--ink-zacht); font-size:.9rem; line-height:1.6; margin:0 0 6px; max-width:60ch}
  .hulp ul{margin:0; padding-left:18px; color:var(--ink-zacht); font-size:.9rem}
  .hulp li{margin:4px 0}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="merknaam">@ygdigital.nl</div>
    <div class="stand laden" id="stand"><span class="stip"></span><span id="standtekst">Laden</span></div>
  </header>

  <nav class="tabs" id="tabs">
    <button type="button" data-tab="vandaag" class="actief">Vandaag</button>
    <button type="button" data-tab="planning">Planning</button>
    <button type="button" data-tab="hulp">Hulp</button>
  </nav>

  <main>
    <section class="tab actief" id="tab-vandaag">
      <div id="melding"></div>
      <div id="installeer"></div>
      <h1 id="vandaagkop">&nbsp;</h1>
      <p class="sub" id="vandaagsub"></p>
      <p class="kopje">Vandaag</p>
      <div id="vandaag"></div>
      <p class="kopje">Daarna</p>
      <div id="daarna"></div>
    </section>

    <section class="tab" id="tab-planning">
      <div class="koprij">
        <div><h1>Planning</h1><p class="sub" id="planningsub"></p></div>
        <a class="knop klein" id="nieuw" href="#" target="_blank" rel="noopener">Nieuw</a>
      </div>
      <details class="kolom vol" id="dezeweekvak" open>
        <summary><span>Deze week</span><span class="tel" id="dezeweektel"></span></summary>
        <div id="dezeweek"></div>
      </details>
      <div class="kopje koprij"><span>Komende weken</span><span class="tel" id="komendtel"></span></div>
      <div class="strook" id="komend"></div>
      <div class="kopje koprij"><span>Geplaatst</span><span class="tel" id="gedaantel"></span></div>
      <div class="strook" id="gedaan"></div>
    </section>

    <section class="tab hulp" id="tab-hulp">
      <h1>Hulp</h1>
      <div id="hulp"></div>
    </section>
  </main>
</div>

<div class="vel" id="vel" aria-modal="true" role="dialog" aria-labelledby="velwanneer">
  <div class="vel-kader">
    <div class="vel-kop">
      <span class="wanneer" id="velwanneer"></span>
      <button type="button" class="sluit" id="velsluit">Sluit</button>
    </div>
    <div class="vel-beeld" id="velbeeld"></div>
    <div class="vel-body">
      <div class="toestand" id="veltoestand"></div>
      <div id="velinhoud"></div>
    </div>
  </div>
</div>

<script>
const REPO = 'SteinClaude/yg-instagram';
const DAGEN = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const MAANDEN = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const dat = s => new Date(s + 'T12:00:00Z');
const lang = s => { const d = dat(s); return DAGEN[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MAANDEN[d.getUTCMonth()]; };
const kort = s => { const d = dat(s); return DAGEN[d.getUTCDay()].slice(0,2) + ' ' + d.getUTCDate() + ' ' + MAANDEN[d.getUTCMonth()].slice(0,3); };
const plusDagen = (s, n) => { const d = dat(s); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); };

function nuAmsterdam(){
  const d = new Intl.DateTimeFormat('nl-NL',{timeZone:'Europe/Amsterdam',year:'numeric',month:'2-digit',
    day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date())
    .reduce((a,p)=>(a[p.type]=p.value,a),{});
  return d.year+'-'+d.month+'-'+d.day+' '+d.hour+':'+d.minute;
}
let NU = nuAmsterdam(), VANDAAG = NU.slice(0,10);
// Een moment uit het logboek ("2026-09-16 19:11") in dezelfde vorm als de rest.
const moment = w => /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(String(w)) ? kort(w.slice(0,10)) + ' · ' + w.slice(11,16) : String(w || '');

let ITEMS = [], GEDAAN = {}, LOGBOEK = [], STAND = null, SLEUTEL = null;
const TABS = ['vandaag','planning','hulp'];
const mini = b => 'mini/' + b.replace(/\//g,'-');
const groot = b => 'beeld/' + b;
// Hoe lang de automaat zelf nog inhaalt (INHAALUREN in src/plaatsen.cjs). Tot die
// tijd is een item dat over zijn tijd is gewoon aan de beurt, geen mislukking:
// de automaat draait pas om vijf over het uur.
const INHAALMINUTEN = 6 * 60;
const minuten = s => { const [d, t] = s.split(' '); const [j, m, dd] = d.split('-').map(Number); const [u, mi] = t.split(':').map(Number); return Date.UTC(j, m - 1, dd, u, mi) / 60000; };
const voorbij = i => (i.datum + ' ' + i.tijd) < NU;
const teLaat = i => minuten(NU) - minuten(i.datum + ' ' + i.tijd) > INHAALMINUTEN;
const status = i => GEDAAN[i.id] ? GEDAAN[i.id].resultaat : (teLaat(i) ? 'onbekend' : 'wacht');
const soortNaam = i => i.soort === 'verhaal' ? 'Verhaal' : ((i.beeld || []).length > 1 ? 'Carrousel' : 'Bericht');

function titelVan(i){
  if (i.tekst){ const r = i.tekst.split('\n').find(x => x.trim()); if (r) return r.trim(); }
  return i.soort === 'verhaal' ? 'Verhaal' : 'Bericht zonder tekst';
}

// Het formulier op GitHub krijgt alles al mee, zodat er alleen nog op Submit
// gedrukt hoeft te worden (en bij een foto: de foto erbij).
function wijzigLink(i, actie){
  return 'https://github.com/' + REPO + '/issues/new?template=wijziging.yml&labels=wijziging'
    + '&title=' + encodeURIComponent('Wijziging ' + i.id)
    + '&item=' + encodeURIComponent(i.id)
    + (actie ? '&actie=' + encodeURIComponent(actie) : '');
}
function nieuwLink(){
  return 'https://github.com/' + REPO + '/issues/new?template=nieuw.yml&labels=wijziging'
    + '&title=' + encodeURIComponent('Nieuw item') + '&soort=Bericht';
}

async function haal(naam, standaard){
  try{
    const a = await fetch(naam + '?t=' + Date.now());
    if (!a.ok) throw new Error(a.status);
    return await a.json();
  }catch(e){ return standaard; }
}

// Haalt alles op en tekent alles opnieuw. Ook bij terugkeren naar de app: op het
// beginscherm blijft de pagina dagenlang leven, en dan moeten klok en stand mee.
let LAATST = 0;
async function laad(){
  NU = nuAmsterdam(); VANDAAG = NU.slice(0,10); LAATST = Date.now();
  const [planning, gedaan, stand, sleutel] = await Promise.all([
    haal('planning.json', null), haal('gedaan.json', {items:[]}), haal('status.json', null), haal('sleutel.json', null)
  ]);
  STAND = stand; SLEUTEL = sleutel;
  tekenStand(); tekenMelding(); tekenInstalleer();
  if (!planning || !Array.isArray(planning.items)){
    document.getElementById('vandaagkop').textContent = 'De planning kon niet geladen worden';
    return;
  }
  ITEMS = planning.items.filter(i => i && i.datum && i.tijd);
  LOGBOEK = (gedaan && Array.isArray(gedaan.items)) ? gedaan.items : [];
  GEDAAN = {}; for (const g of LOGBOEK) GEDAAN[g.id] = g;
  try { tekenVandaag(); tekenPlanning(); tekenHulp(); }
  catch (e) { document.getElementById('vandaagkop').textContent = 'De planning kon niet getoond worden'; console.error(e); }
}
function ververs(){
  if (document.visibilityState === 'visible' && Date.now() - LAATST > 30000 && !VEL_OPEN) laad();
}
document.addEventListener('visibilitychange', ververs);
window.addEventListener('pageshow', ververs);
setInterval(ververs, 5 * 60 * 1000);

document.getElementById('nieuw').href = nieuwLink();
if (history.state && history.state.vel) history.replaceState(null, '');   // na verversen met open scherm
zetTabsOp();
laad();

// --- tabbladen ---------------------------------------------------------------
function toonTab(naam){
  if (TABS.indexOf(naam) < 0) naam = 'vandaag';
  for (const t of TABS){
    document.getElementById('tab-' + t).classList.toggle('actief', t === naam);
  }
  for (const k of document.querySelectorAll('#tabs button')){
    const actief = k.dataset.tab === naam;
    k.classList.toggle('actief', actief);
    if (actief) k.setAttribute('aria-current', 'page'); else k.removeAttribute('aria-current');
  }
  history.replaceState(history.state, '', naam === 'vandaag' ? location.pathname : '#' + naam);
  window.scrollTo(0, 0);
}
function zetTabsOp(){
  for (const k of document.querySelectorAll('#tabs button')) k.addEventListener('click', () => toonTab(k.dataset.tab));
  toonTab(location.hash.replace('#',''));
}

// --- de bovenbalk en de melding ---------------------------------------------
function tekenStand(){
  const el = document.getElementById('stand'), t = document.getElementById('standtekst');
  el.classList.remove('laden','stil');
  if (!STAND){ t.textContent = 'Onbekend'; el.classList.add('stil'); return; }
  if (STAND.stand === 'in orde'){ t.textContent = 'In orde'; return; }
  el.classList.add('stil');
  t.textContent = STAND.stand === 'staat stil' ? 'Staat stil' : 'Niet ingesteld';
}

function tekenMelding(){
  const vak = document.getElementById('melding');
  if (!STAND || STAND.stand === 'in orde'){ vak.innerHTML = ''; return; }
  const kop = STAND.stand === 'staat stil' ? 'Het plaatsen staat stil' : 'De automaat is nog niet ingesteld';
  vak.innerHTML = '';
  const m = document.createElement('div'); m.className = 'melding';
  const b = document.createElement('b'); b.textContent = kop;
  const p1 = document.createElement('p'); p1.textContent = String(STAND.bericht || '');
  const p2 = document.createElement('p'); p2.textContent = 'Er gaat niets verloren: de planning blijft staan en gaat vanzelf verder zodra dit is opgelost.';
  m.append(b, p1, p2);
  if (STAND.sinds){ const s = document.createElement('small'); s.textContent = 'zo sinds ' + moment(STAND.sinds); m.appendChild(s); }
  vak.appendChild(m);
}

// Op een telefoon, niet als app: één keer uitnodigen om hem op het beginscherm te zetten.
const ALS_APP = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const MOBIEL = /iPhone|iPad|Android/i.test(navigator.userAgent);
const IOS = /iPhone|iPad/i.test(navigator.userAgent);
function tekenInstalleer(){
  const vak = document.getElementById('installeer');
  let weg = false; try { weg = localStorage.getItem('installeer-weg') === '1'; } catch(e){}
  if (ALS_APP || !MOBIEL || weg) return;
  vak.innerHTML = '<div class="installeer"><div><b>Zet dit op je beginscherm</b>, dan opent het als app. '
    + (IOS ? 'Tik op Delen en dan op <em>Zet op beginscherm</em>.' : 'Tik op de drie puntjes en dan op <em>Toevoegen aan startscherm</em>.')
    + '</div><button type="button" class="knop klein" id="installeer-weg">Oké</button></div>';
  document.getElementById('installeer-weg').onclick = () => {
    try { localStorage.setItem('installeer-weg', '1'); } catch(e){}
    vak.innerHTML = '';
  };
}

// --- regels ------------------------------------------------------------------
function rechtsVan(i){
  const st = status(i);
  if (st === 'geplaatst') return ['Geplaatst', 'ok'];
  if (st === 'stond er al') return ['Geplaatst', 'ok'];
  if (st === 'overgeslagen') return ['Overgeslagen', 'mis'];
  if (st === 'onbekend') return ['Niet gelukt', 'mis'];
  if (voorbij(i)) return ['Aan de beurt', ''];
  return ['', ''];
}

// opties.kort: in een kolom; dan zonder het soort in de regel erboven, anders
// breekt "carrousel" over twee regels.
function rij(i, opties){
  opties = opties || {};
  const st = status(i);
  const b = document.createElement('button'); b.type = 'button';
  b.className = 'rij' + (st !== 'wacht' ? ' voorbij' : '');
  const b0 = (i.beeld || [])[0];
  const img = document.createElement('img'); if (b0) img.src = mini(b0); img.alt = ''; img.loading = 'lazy';
  const midden = document.createElement('div');
  // Bij een verhaal is de titel al "Verhaal"; dan niet nog eens in de regel erboven.
  const wanneer = document.createElement('div'); wanneer.className = 'wanneer';
  wanneer.textContent = kort(i.datum) + ' · ' + i.tijd
    + (i.soort === 'verhaal' || opties.kort ? '' : ' · ' + soortNaam(i).toLowerCase());
  const titel = document.createElement('div'); titel.className = 'titel'; titel.textContent = titelVan(i);
  midden.append(wanneer, titel);
  const [tekst, klasse] = rechtsVan(i);
  const recht = document.createElement('span');
  if (tekst){ recht.className = 'recht ' + klasse; recht.textContent = tekst; }
  else { recht.className = 'pijl'; recht.textContent = '›'; }
  b.append(img, midden, recht);
  b.setAttribute('aria-label', soortNaam(i) + ' ' + kort(i.datum) + ' ' + i.tijd + ', ' + titelVan(i) + (tekst ? ', ' + tekst.toLowerCase() : ''));
  b.addEventListener('click', () => openVel(i, b));
  return b;
}

function vul(houder, lijst, leegTekst, opties){
  const h = document.getElementById(houder); h.innerHTML = '';
  if (!lijst.length){ h.innerHTML = '<p class="leeg">' + leegTekst + '</p>'; return; }
  for (const i of lijst) h.appendChild(rij(i, opties));
}

// --- Vandaag -----------------------------------------------------------------
function tekenVandaag(){
  document.getElementById('vandaagkop').textContent = lang(VANDAAG);
  const over = ITEMS.filter(i => status(i) === 'wacht').length;
  const laatste = ITEMS[ITEMS.length - 1];
  document.getElementById('vandaagsub').textContent = over
    ? over + (over === 1 ? ' item' : ' items') + ' gepland tot ' + lang(laatste.datum)
    : 'De planning is afgelopen.';
  vul('vandaag', ITEMS.filter(i => i.datum === VANDAAG), 'Vandaag staat er niets gepland.', { });
  vul('daarna', ITEMS.filter(i => i.datum > VANDAAG && !GEDAAN[i.id]).slice(0, 6), 'Er komt niets meer aan. Vraag Claude om een nieuwe reeks.');
}

// --- Planning ----------------------------------------------------------------
function weekVan(d){ const x = dat(d); x.setUTCDate(x.getUTCDate() - ((x.getUTCDay()+6)%7)); return x.toISOString().slice(0,10); }
const weekNaam = start => 'Week van ' + kort(start).slice(3);

// Een kolom per week, naast elkaar te schuiven.
function kolom(start, lijst){
  const k = document.createElement('div'); k.className = 'kolom';
  const h = document.createElement('h3');
  h.innerHTML = '<span>' + weekNaam(start) + '</span><span class="tel">' + lijst.length + '</span>';
  k.appendChild(h);
  for (const el of lijst) k.appendChild(el);
  return k;
}

function strook(houder, weken, leegTekst){
  const h = document.getElementById(houder); h.innerHTML = '';
  if (!weken.length){ h.innerHTML = '<p class="leeg">' + leegTekst + '</p>'; return; }
  for (const [start, lijst] of weken) h.appendChild(kolom(start, lijst));
}

// Een regel uit het logboek waarvan het item niet meer in de planning staat
// (bijvoorbeeld daarna verzet): alleen wat het nummer nog verraadt.
function logRij(g){
  const m = String(g.id).match(/^(\d{4}-\d{2}-\d{2})-(verhaal|bericht)/);
  const p = document.createElement('div'); p.className = 'rij voorbij'; p.style.cursor = 'default';
  const wanneer = document.createElement('div'); wanneer.className = 'wanneer';
  wanneer.textContent = m ? kort(m[1]) + (m[2] === 'bericht' ? ' · bericht' : '') : String(g.id);
  const titel = document.createElement('div'); titel.className = 'titel';
  titel.textContent = m ? (m[2] === 'verhaal' ? 'Verhaal' : 'Bericht') + ', niet meer in de planning' : 'Onbekend item';
  const midden = document.createElement('div'); midden.append(wanneer, titel);
  const recht = document.createElement('span'); recht.className = 'recht ' + (g.resultaat === 'geplaatst' ? 'ok' : 'mis');
  recht.textContent = g.resultaat === 'geplaatst' ? 'Geplaatst' : 'Overgeslagen';
  p.append(document.createElement('span'), midden, recht);
  return p;
}

function tekenPlanning(){
  const over = ITEMS.filter(i => status(i) === 'wacht').length;
  document.getElementById('planningsub').textContent = over + ' nog te gaan';
  const dezeWeek = weekVan(VANDAAG);

  // Deze week: uitklapbaar, en of hij dicht stond onthouden we.
  const vak = document.getElementById('dezeweekvak');
  if (!vak.dataset.klaar){
    vak.dataset.klaar = '1';
    try { if (localStorage.getItem('dezeweek-dicht') === '1') vak.open = false; } catch(e){}
    vak.addEventListener('toggle', () => { try { localStorage.setItem('dezeweek-dicht', vak.open ? '0' : '1'); } catch(e){} });
  }
  const dw = ITEMS.filter(i => weekVan(i.datum) === dezeWeek);
  const dwHouder = document.getElementById('dezeweek'); dwHouder.innerHTML = '';
  if (!dw.length) dwHouder.innerHTML = '<p class="leeg">Deze week staat er niets gepland.</p>';
  for (const i of dw) dwHouder.appendChild(rij(i, { kort: true }));
  const dwOver = dw.filter(i => status(i) === 'wacht').length;
  document.getElementById('dezeweektel').textContent = dw.length ? dwOver + ' te gaan' : '';

  // Komende weken: alles na deze week, in kolommen.
  const komend = new Map();
  for (const i of ITEMS){
    const w = weekVan(i.datum); if (w <= dezeWeek) continue;
    if (!komend.has(w)) komend.set(w, []);
    komend.get(w).push(rij(i, { kort: true }));
  }
  document.getElementById('komendtel').textContent = komend.size ? (komend.size === 1 ? '1 week' : komend.size + ' weken') : '';
  strook('komend', [...komend], 'Er komt niets meer aan. Vraag Claude om een nieuwe reeks.');

  // Geplaatst: de weken vóór deze week, nieuwste eerst (deze week staat al boven).
  // Plus de regels uit het logboek waarvan het item niet meer in de planning staat.
  const perId = {}; for (const i of ITEMS) perId[i.id] = i;
  const geweest = new Map();
  const voeg = (w, el) => { if (!geweest.has(w)) geweest.set(w, []); geweest.get(w).push(el); };
  for (const i of ITEMS){
    const w = weekVan(i.datum);
    if (w >= dezeWeek || status(i) === 'wacht') continue;
    voeg(w, rij(i, { kort: true }));
  }
  for (const g of LOGBOEK){
    if (perId[g.id]) continue;
    const m = String(g.id).match(/^\d{4}-\d{2}-\d{2}/);
    voeg(m ? weekVan(m[0]) : dezeWeek, logRij(g));
  }
  const geplaatst = LOGBOEK.filter(g => g.resultaat === 'geplaatst' || g.resultaat === 'stond er al').length;
  document.getElementById('gedaantel').textContent = geplaatst ? geplaatst + ' geplaatst' : '';
  strook('gedaan', [...geweest].sort((a, b) => b[0].localeCompare(a[0])), 'Nog geen eerdere weken.');
}

// --- Hulp --------------------------------------------------------------------
function ritme(items){
  const zien = {};
  for (const i of items) {
    const d = dat(i.datum).getUTCDay();
    if (!zien[i.soort]) zien[i.soort] = {};
    if (!zien[i.soort][d]) zien[i.soort][d] = [];
    if (zien[i.soort][d].indexOf(i.tijd) < 0) zien[i.soort][d].push(i.tijd);
  }
  const regel = (soort, naam) => {
    const dagen = Object.keys(zien[soort] || {}).map(Number).sort();
    if (!dagen.length) return '';
    return naam + ' ' + dagen.map(d => DAGEN[d] + ' ' + zien[soort][d].sort().join(' en ')).join(', ') + '.';
  };
  return [regel('verhaal','Verhalen:'), regel('bericht','Berichten:')].filter(Boolean).join(' ');
}

function tekenHulp(){
  const h = document.getElementById('hulp');
  let sleutel = '';
  if (SLEUTEL && SLEUTEL.sinds){
    const tot = plusDagen(SLEUTEL.sinds, 60);
    sleutel = '<h2>De sleutel</h2><p>De Instagram-sleutel is geldig tot ongeveer ' + lang(tot) + '. Twaalf dagen daarvoor waarschuwt de automaat; vernieuwen doe je samen met Claude.</p>';
  }
  h.innerHTML =
    '<h2>Hoe het werkt</h2>'
    + '<p>Elk uur kijkt de automaat of er iets aan de beurt is en plaatst dat op @ygdigital.nl. Deze app leest dezelfde planning en hetzelfde logboek, dus wat je hier ziet is de werkelijke stand.</p>'
    + '<p>' + ritme(ITEMS) + '</p>'
    + '<h2>Wijzigen</h2>'
    + '<p>Tik op een item. Foto, Tekst, Verzetten en Overslaan openen een kort formulier op GitHub waarin alles al is ingevuld. De eerste keer log je daar in; daarna onthoudt je telefoon dat. Binnen een minuut is het verwerkt en zie je het hier terug.</p>'
    + '<p>Met <em>Nieuw</em> (bij Planning) zet je een eigen foto op een datum, als bericht met tekst of als verhaal.</p>'
    + '<h2>Foto’s</h2>'
    + '<p>Een foto uit je telefoon wordt staand bijgesneden: 4:5 voor een bericht, 9:16 voor een verhaal. Het onderwerp blijft zoveel mogelijk in beeld. Een foto die al staand is geeft het beste resultaat.</p>'
    + sleutel
    + (ALS_APP || !MOBIEL ? '' : '<h2>Op je beginscherm</h2><p>' + (IOS ? 'Tik op Delen en dan op <em>Zet op beginscherm</em>.' : 'Tik op de drie puntjes en dan op <em>Toevoegen aan startscherm</em>.') + ' Dan opent dit als app, zonder adresbalk.</p>')
    + '<h2>Achter de schermen</h2>'
    + '<ul><li><a href="https://github.com/' + REPO + '/blob/main/planning.json">De planning</a></li>'
    + '<li><a href="https://github.com/' + REPO + '/actions">Het logboek van de automaat</a></li>'
    + '<li><a href="https://github.com/' + REPO + '/issues">Je meldingen</a></li></ul>';
}

// --- het detailscherm --------------------------------------------------------
const VEL = document.getElementById('vel');
let VEL_OPEN = false, VEL_VAN = null;   // VEL_VAN: de regel waar het vandaan kwam, voor de focus

function openVel(i, van){
  document.getElementById('velwanneer').textContent = soortNaam(i) + ' · ' + kort(i.datum) + ' · ' + i.tijd;
  const beeld = document.getElementById('velbeeld'); beeld.innerHTML = '';
  for (const b of (i.beeld || [])){ const img = document.createElement('img'); img.src = groot(b); img.alt = ''; beeld.appendChild(img); }
  // De toestand alleen als er iets over te zeggen is; "gepland" staat al in de kop.
  const st = status(i), toestand = document.getElementById('veltoestand');
  const g = GEDAAN[i.id];
  toestand.className = 'toestand'; toestand.textContent = '';
  if (st === 'geplaatst' || st === 'stond er al'){ toestand.classList.add('ok'); toestand.textContent = 'Geplaatst' + (g && g.wanneer ? ' op ' + moment(g.wanneer) : ''); }
  else if (st === 'overgeslagen'){ toestand.classList.add('mis'); toestand.textContent = 'Overgeslagen' + (g && g.wanneer ? ' op ' + moment(g.wanneer) : ''); }
  else if (st === 'onbekend'){ toestand.classList.add('mis'); toestand.textContent = 'Niet gelukt'; }
  else if (voorbij(i)) toestand.textContent = 'Aan de beurt; de automaat plaatst het binnen het uur';

  const inhoud = document.getElementById('velinhoud'); inhoud.innerHTML = '';
  if (i.tekst){ const t = document.createElement('div'); t.className = 'bijschrift'; t.textContent = i.tekst; inhoud.appendChild(t); }
  else if (i.soort === 'verhaal'){ const t = document.createElement('p'); t.className = 'noot'; t.textContent = 'Een verhaal heeft geen tekst eronder; de tekst staat op de plaat zelf.'; inhoud.appendChild(t); }

  if (st === 'wacht'){
    const a = document.createElement('div'); a.className = 'acties';
    const keuzes = i.soort === 'verhaal'
      ? ['Foto wijzigen', 'Verzetten', 'Overslaan']
      : ['Foto wijzigen', 'Tekst wijzigen', 'Verzetten', 'Overslaan'];
    for (const keuze of keuzes){
      const k = document.createElement('a'); k.className = 'knop'; k.href = wijzigLink(i, keuze);
      k.target = '_blank'; k.rel = 'noopener'; k.textContent = keuze;
      a.appendChild(k);
    }
    const noot = document.createElement('p'); noot.className = 'noot';
    noot.textContent = 'Opent een kort formulier op GitHub met alles al ingevuld. Eén keer inloggen; daarna onthoudt je telefoon dat.';
    inhoud.append(a, noot);
  }

  VEL.classList.add('open'); VEL_OPEN = true; VEL_VAN = van || null;
  document.body.style.overflow = 'hidden';
  document.querySelector('.app').inert = true;
  VEL.scrollTop = 0;
  document.getElementById('velsluit').focus();
  history.pushState({ vel: i.id }, '');
}

// Sluiten kan met de knop, met de terugknop van de telefoon, en op een groot
// scherm door naast het venster te klikken.
function sluitVel(viaTerug){
  if (!VEL_OPEN) return;
  VEL.classList.remove('open'); VEL_OPEN = false;
  document.body.style.overflow = '';
  document.querySelector('.app').inert = false;
  if (VEL_VAN && VEL_VAN.isConnected) VEL_VAN.focus();
  if (!viaTerug && history.state && history.state.vel) history.back();
}
document.getElementById('velsluit').addEventListener('click', () => sluitVel(false));
VEL.addEventListener('click', e => { if (e.target === VEL) sluitVel(false); });
window.addEventListener('popstate', () => { if (VEL_OPEN) sluitVel(true); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') sluitVel(false); });
</script>
